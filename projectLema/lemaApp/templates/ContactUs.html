<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Wildlife Explorer</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
 
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Wildlife Explorer</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/projectLema/lemaApp/templates/home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/projectLema/lemaApp/templates/animals.html">Animals</a></li> 
                    <li class="nav-item"><a class="nav-link" href="a/projectLema/lemaApp/templates/about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/projectLema/lemaApp/templates/contactus.html">Contact Us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contact Form -->
    <main class="container my-5">
      <div class="bg-white p-5 rounded shadow-sm">
        <h1 class="text-success fw-bold mb-4">Contact Us</h1>
        <p class="text-muted">
          Have questions or feedback? Reach out to us using the form below.
        </p>

        <form>
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input
              type="text"
              class="form-control"
              id="name"
              placeholder="Your full name"
            />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form -control"
              id="email"
              placeholder="name@example.com"
            />
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea
              class="form-control"
              id="message"
              rows="5"
              placeholder="Write your message here..."
            ></textarea>
          </div>
          <button type="submit" class="btn btn-success fw-bold">
            Send Message
          </button>
        </form>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
      <small>&copy; 2025 Wildlife Explorer. All rights reserved.</small>
    </footer>
  </body>
</html>
